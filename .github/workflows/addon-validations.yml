name: Add-on Validations

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  addon-validations:
    name: Add-on Validations
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout Add-on
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install git+https://github.com/xbmc/addon-check.git@67be5c1eca23e01402a447f995e2216bd83202f3

      - name: Pytest regression suite
        working-directory: ${{ github.event.repository.name }}
        run: python -m pytest -q

      - name: Kodi Add-on Checker (Omega)
        run: |
          kodi-addon-checker ${{ github.event.repository.name }} --branch=omega

      - name: Kodi Add-on Checker (Nexus)
        run: |
          kodi-addon-checker ${{ github.event.repository.name }} --branch=nexus

  package:
    name: Package Validation
    needs: addon-validations
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: Serph91P/repository.serph91p/.github/workflows/reusable-addon-package.yml@7adff881ab5d0a7fc63f7474a78b2688e2e6eee4
    with:
      addon_id: plugin.video.gronkhtv
      runtime_entries_json: '["addon.xml","addon.py","resources/"]'
