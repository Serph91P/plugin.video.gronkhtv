name: Make Release

on:
  workflow_call:
    inputs:
      validation_run_id:
        required: true
        type: number
      validation_head_sha:
        required: true
        type: string
      addon_version:
        required: true
        type: string
      asset_name:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.validation_head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download exact validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: addon-package
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}

      - name: Verify package identity and digest
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
          VERSION: ${{ inputs.addon_version }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ASSET_NAME"
          actual=$(sha256sum "$ASSET_NAME" | cut -d' ' -f1)
          test "$actual" = "$EXPECTED_SHA256"
          python scripts/build_release.py --verify-only --output "$ASSET_NAME" --expected-version "$VERSION"
          source_version=$(python -c 'from pathlib import Path; from scripts.build_release import parse_addon_xml; print(parse_addon_xml(Path("addon.xml"))[1])')
          test "$source_version" = "$VERSION"
          test "$ASSET_NAME" = "plugin.video.gronkhtv-${VERSION}.zip"

      - name: Publish or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.addon_version }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
          VALIDATED_SHA: ${{ inputs.validation_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "${tag}^{commit}")" = "$VALIDATED_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$VALIDATED_SHA" -m "Release $tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            asset_count=$(gh release view "$tag" --json assets --jq "[.assets[] | select(.name == \"$ASSET_NAME\")] | length")
            if [ "$asset_count" = 0 ]; then
              gh release upload "$tag" "$ASSET_NAME"
            elif [ "$asset_count" = 1 ]; then
              tmp=$(mktemp)
              gh release download "$tag" --pattern "$ASSET_NAME" --output "$tmp"
              test "$(sha256sum "$tmp" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
            else
              echo "Release contains duplicate assets named $ASSET_NAME" >&2
              exit 1
            fi
          else
            gh release create "$tag" "$ASSET_NAME" --verify-tag --title "$tag" --notes-from-tag
          fi
