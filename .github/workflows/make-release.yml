name: Make Release

on:
  push:
    branches: [main]
    paths:
      - 'addon.xml'
      - 'addon.py'
      - 'resources/**'

permissions:
  contents: write

jobs:
  release:
    name: Make Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Add-on
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils xmlstarlet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version and check tag
        id: version
        run: |
          version=$(xmlstarlet sel -t -v 'string(/addon/@version)' addon.xml)
          filename=${{ github.event.repository.name }}-${version}.zip
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "filename=$filename" >> $GITHUB_OUTPUT

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

          if gh api "repos/${{ github.repository }}/releases/tags/v$version" --jq '.assets[].name' 2>/dev/null | grep -Fxq -- "$filename"; then
            echo "asset_exists=true" >> $GITHUB_OUTPUT
          else
            echo "asset_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Zip
        if: steps.version.outputs.tag_exists == 'false' || steps.version.outputs.asset_exists == 'false'
        id: create-zip
        run: |
          filename=${{ steps.version.outputs.filename }}
          python scripts/build_release.py --source . --output "${GITHUB_WORKSPACE}/${filename}"
          echo "filename=$filename" >> $GITHUB_OUTPUT

      - name: Verify Zip
        if: steps.version.outputs.tag_exists == 'false' || steps.version.outputs.asset_exists == 'false'
        run: |
          python scripts/build_release.py --verify-only --output "${GITHUB_WORKSPACE}/${{ steps.create-zip.outputs.filename }}"

      - name: Check tag points to current commit (retry safety)
        if: steps.version.outputs.tag_exists == 'true' && steps.version.outputs.asset_exists == 'false'
        run: |
          tag_sha=$(git rev-parse "v${{ steps.version.outputs.version }}")
          if [ "$tag_sha" != "${{ github.sha }}" ]; then
            echo "Tag v${{ steps.version.outputs.version }} points to $tag_sha but current commit is ${{ github.sha }}"
            echo "Refusing to attach asset built from different commit to existing immutable tag"
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Get Changelog
        if: steps.version.outputs.tag_exists == 'false' || steps.version.outputs.asset_exists == 'false'
        id: changelog
        run: |
          changes=$(xmlstarlet sel -t -v '//news' -n addon.xml)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changes<<$EOF" >> $GITHUB_OUTPUT
          echo "$changes" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.version.outputs.tag_exists == 'false' || steps.version.outputs.asset_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: "${{ steps.create-zip.outputs.filename }}"
          body: ${{ steps.changelog.outputs.changes }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release asset
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.version.outputs.version }}" --jq '.assets[].name' | grep -Fxq -- "${{ steps.create-zip.outputs.filename }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}