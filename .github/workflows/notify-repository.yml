name: Notify Repository

on:
  workflow_call:
    inputs:
      validation_run_id:
        required: true
        type: number
      validation_head_sha:
        required: true
        type: string
      validation_event:
        required: true
        type: string
      addon_id:
        required: true
        type: string
      addon_version:
        required: true
        type: string
      asset_name:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      publication_id:
        required: true
        type: string
    secrets:
      REPO_DISPATCH_TOKEN:
        required: true

jobs:
  notify-repository:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: Serph91P/repository.serph91p/.github/workflows/reusable-notify-repository.yml@7adff881ab5d0a7fc63f7474a78b2688e2e6eee4
    with:
      source_repository: ${{ github.repository }}
      candidate_sha: ${{ inputs.validation_head_sha }}
      validation_run_id: ${{ inputs.validation_run_id }}
      validation_workflow: Add-on Validations
      validation_workflow_path: .github/workflows/addon-validations.yml
      validation_event: ${{ inputs.validation_event }}
      expected_branch: develop
      addon_id: ${{ inputs.addon_id }}
      addon_version: ${{ inputs.addon_version }}
      asset_name: ${{ inputs.asset_name }}
      artifact_sha256: ${{ inputs.artifact_sha256 }}
      publication_id: ${{ inputs.publication_id }}
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
