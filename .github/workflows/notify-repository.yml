name: Notify Repository

on:
  workflow_run:
    workflows: ["Make Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify-repository:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: Serph91P/repository.serph91p
          event-type: addon-updated
          client-payload: '{"addon": "plugin.video.gronkhtv", "ref": "${{ github.event.workflow_run.head_branch }}", "sha": "${{ github.event.workflow_run.head_sha }}"}'
