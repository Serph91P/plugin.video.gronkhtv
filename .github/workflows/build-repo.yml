name: Build Kodi Repository

on:
  push:
    branches:
      - main
    paths:
      - 'addon.xml'
      - 'addon.py'
      - 'resources/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Get version from addon.xml
        id: get_version
        run: |
          VERSION=$(grep -oP 'version="\K[^"]+' addon.xml | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Addon version: $VERSION"
          
          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist - will create"
          fi
      
      - name: Create and push tag
        if: steps.get_version.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"
      
      - name: Create addon zip
        run: |
          mkdir -p repo/plugin.video.gronkhtv
          
          # Copy addon files (exclude dev files)
          rsync -av --exclude='.git*' \
                    --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='logs' \
                    --exclude='.github' \
                    --exclude='repo' \
                    ./ repo/plugin.video.gronkhtv/
          
          # Create versioned zip in addon folder (required for Kodi repo structure)
          cd repo
          zip -r plugin.video.gronkhtv/plugin.video.gronkhtv-${{ steps.get_version.outputs.version }}.zip plugin.video.gronkhtv
          
          # Also keep a copy in root for direct download
          cp plugin.video.gronkhtv/plugin.video.gronkhtv-${{ steps.get_version.outputs.version }}.zip ./
      
      - name: Generate addons.xml
        run: |
          python3 << 'EOF'
          import os
          import hashlib
          import xml.etree.ElementTree as ET
          
          repo_dir = 'repo'
          addons_xml = '<?xml version="1.0" encoding="UTF-8"?>\n<addons>\n'
          
          # Find all addon.xml files
          for addon_dir in os.listdir(repo_dir):
              addon_xml_path = os.path.join(repo_dir, addon_dir, 'addon.xml')
              if os.path.isfile(addon_xml_path):
                  with open(addon_xml_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                      # Remove XML declaration if present
                      if content.startswith('<?xml'):
                          content = content.split('?>', 1)[1].strip()
                      addons_xml += content + '\n'
          
          addons_xml += '</addons>'
          
          # Write addons.xml
          with open(os.path.join(repo_dir, 'addons.xml'), 'w', encoding='utf-8') as f:
              f.write(addons_xml)
          
          # Generate MD5 checksum
          with open(os.path.join(repo_dir, 'addons.xml'), 'rb') as f:
              md5 = hashlib.md5(f.read()).hexdigest()
          
          with open(os.path.join(repo_dir, 'addons.xml.md5'), 'w') as f:
              f.write(md5)
          
          print(f"Generated addons.xml with MD5: {md5}")
          EOF
      
      - name: Copy icon for repo
        run: |
          cp resources/icon.png repo/plugin.video.gronkhtv/icon.png 2>/dev/null || true
      
      - name: Create repository addon
        run: |
          mkdir -p repo/repository.gronkhtv
          
          cat > repo/repository.gronkhtv/addon.xml << 'REPOXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <addon id="repository.gronkhtv" name="Gronkh.tv Repository" version="1.0.0" provider-name="Seraph91P">
              <extension point="xbmc.addon.repository" name="Gronkh.tv Repository">
                  <dir>
                      <info compressed="false">https://serph91p.github.io/plugin.video.gronkhtv/addons.xml</info>
                      <checksum>https://serph91p.github.io/plugin.video.gronkhtv/addons.xml.md5</checksum>
                      <datadir zip="true">https://serph91p.github.io/plugin.video.gronkhtv</datadir>
                  </dir>
              </extension>
              <extension point="xbmc.addon.metadata">
                  <platform>all</platform>
                  <summary lang="en_GB">Gronkh.tv Addon Repository</summary>
                  <summary lang="de_DE">Gronkh.tv Addon Repository</summary>
                  <description lang="en_GB">Repository for the Gronkh.tv Kodi addon. Install this to receive automatic updates.</description>
                  <description lang="de_DE">Repository fuer das Gronkh.tv Kodi Addon. Installiere dies um automatische Updates zu erhalten.</description>
              </extension>
          </addon>
          REPOXML
          
          # Create repo zip
          cd repo
          zip -r repository.gronkhtv-1.0.0.zip repository.gronkhtv
          cp repository.gronkhtv-1.0.0.zip repository.gronkhtv/repository.gronkhtv-1.0.0.zip
      
      - name: Update addons.xml with repository
        run: |
          python3 << 'EOF'
          import os
          import hashlib
          
          repo_dir = 'repo'
          addons_xml = '<?xml version="1.0" encoding="UTF-8"?>\n<addons>\n'
          
          # Find all addon.xml files
          for addon_dir in sorted(os.listdir(repo_dir)):
              addon_xml_path = os.path.join(repo_dir, addon_dir, 'addon.xml')
              if os.path.isfile(addon_xml_path):
                  with open(addon_xml_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                      # Remove XML declaration if present
                      if content.startswith('<?xml'):
                          content = content.split('?>', 1)[1].strip()
                      addons_xml += content + '\n'
          
          addons_xml += '</addons>'
          
          # Write addons.xml
          with open(os.path.join(repo_dir, 'addons.xml'), 'w', encoding='utf-8') as f:
              f.write(addons_xml)
          
          # Generate MD5 checksum
          with open(os.path.join(repo_dir, 'addons.xml'), 'rb') as f:
              md5 = hashlib.md5(f.read()).hexdigest()
          
          with open(os.path.join(repo_dir, 'addons.xml.md5'), 'w') as f:
              f.write(md5)
          
          print(f"Final addons.xml with MD5: {md5}")
          EOF
      
      - name: Create index.html
        run: |
          cat > repo/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Gronkh.tv Kodi Repository</title>
              <style>
                  body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; background: #1a1a2e; color: #eee; }
                  h1 { color: #4cc9f0; }
                  h2 { color: #7209b7; border-bottom: 2px solid #7209b7; padding-bottom: 10px; }
                  h3 { color: #f72585; }
                  a { color: #4cc9f0; }
                  .download { background: linear-gradient(135deg, #7209b7, #f72585); color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; display: inline-block; margin: 10px 5px; font-weight: bold; }
                  .download:hover { opacity: 0.9; transform: scale(1.02); }
                  code { background: #2d2d44; padding: 4px 8px; border-radius: 4px; font-family: monospace; color: #4cc9f0; }
                  .instructions { background: #16213e; padding: 25px; border-radius: 12px; margin: 20px 0; border: 1px solid #7209b7; }
                  .method { margin-bottom: 30px; }
                  ol, ul { line-height: 1.8; }
                  .url-box { background: #0f0f23; padding: 15px; border-radius: 8px; margin: 10px 0; word-break: break-all; border-left: 4px solid #4cc9f0; }
                  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
                  .feature { background: #16213e; padding: 12px; border-radius: 8px; }
                  .copy-btn { background: #4cc9f0; color: #1a1a2e; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
              </style>
          </head>
          <body>
              <h1>🎮 Gronkh.tv Kodi Repository</h1>
              <p>Installiere das Repository um automatische Updates fuer das Gronkh.tv Addon zu erhalten.</p>
              
              <h2>📥 Installation</h2>
              
              <div class="instructions">
                  <div class="method">
                      <h3>Methode 1: Per URL im File Manager (empfohlen)</h3>
                      <p>So fügst du das Repository direkt in Kodi hinzu:</p>
                      <ol>
                          <li>Gehe zu <strong>Einstellungen</strong> → <strong>Dateimanager</strong></li>
                          <li>Wähle <strong>Quelle hinzufügen</strong></li>
                          <li>Klicke auf <strong>&lt;Keine&gt;</strong> und gib folgende URL ein:</li>
                      </ol>
                      <div class="url-box">
                          <code id="repo-url">https://serph91p.github.io/plugin.video.gronkhtv/</code>
                          <button class="copy-btn" onclick="navigator.clipboard.writeText('https://serph91p.github.io/plugin.video.gronkhtv/')">📋 Kopieren</button>
                      </div>
                      <ol start="4">
                          <li>Gib einen Namen ein, z.B. <strong>Gronkh.tv Repo</strong></li>
                          <li>Klicke <strong>OK</strong></li>
                          <li>Gehe zu <strong>Einstellungen</strong> → <strong>Add-ons</strong> → <strong>Aus ZIP-Datei installieren</strong></li>
                          <li>Wähle <strong>Gronkh.tv Repo</strong></li>
                          <li>Wähle <strong>repository.gronkhtv</strong> → <strong>repository.gronkhtv-1.0.0.zip</strong></li>
                          <li>Dann: <strong>Aus Repository installieren</strong> → <strong>Gronkh.tv Repository</strong> → <strong>Video Add-ons</strong> → <strong>Gronkh.tv</strong></li>
                      </ol>
                  </div>
                  
                  <div class="method">
                      <h3>Methode 2: ZIP herunterladen</h3>
                      <p>Lade die ZIP-Datei herunter und installiere sie manuell:</p>
                      <ol>
                          <li>Lade die Repository-ZIP herunter</li>
                          <li>In Kodi: <strong>Einstellungen</strong> → <strong>Add-ons</strong> → <strong>Aus ZIP-Datei installieren</strong></li>
                          <li>Navigiere zur heruntergeladenen ZIP-Datei</li>
                          <li>Dann: <strong>Aus Repository installieren</strong> → <strong>Gronkh.tv Repository</strong> → <strong>Video Add-ons</strong> → <strong>Gronkh.tv</strong></li>
                      </ol>
                      <a class="download" href="repository.gronkhtv/repository.gronkhtv-1.0.0.zip">📦 Repository ZIP</a>
                      <a class="download" href="plugin.video.gronkhtv/">📺 Addon direkt</a>
                  </div>
              </div>
              
              <h2>✨ Features</h2>
              <div class="features">
                  <div class="feature">🎬 Alle Gronkh Streams</div>
                  <div class="feature">🖼️ Thumbnails & Poster</div>
                  <div class="feature">⏯️ Wiedergabe fortsetzen</div>
                  <div class="feature">⭐ Favoriten/Watchlist</div>
                  <div class="feature">🎮 Nach Spielen filtern</div>
                  <div class="feature">📑 Kapitel-Navigation</div>
                  <div class="feature">⏭️ Auto nächste Episode</div>
                  <div class="feature">🔍 Stream-Suche</div>
              </div>
              
              <h2>ℹ️ Hinweise</h2>
              <ul>
                  <li>Erfordert <strong>Kodi 21 (Omega)</strong> oder neuer</li>
                  <li>Bei Problemen: <a href="https://github.com/Serph91P/plugin.video.gronkhtv/issues">GitHub Issues</a></li>
                  <li>Quellcode: <a href="https://github.com/Serph91P/plugin.video.gronkhtv">GitHub Repository</a></li>
              </ul>
          </body>
          </html>
          HTML
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            repo/plugin.video.gronkhtv-${{ steps.get_version.outputs.version }}.zip
            repo/repository.gronkhtv-1.0.0.zip
          body: |
            ## Gronkh.tv Kodi Addon v${{ steps.get_version.outputs.version }}
            
            ### Installation
            1. Lade `repository.gronkhtv-1.0.0.zip` herunter
            2. In Kodi: Einstellungen → Add-ons → Aus ZIP-Datei installieren
            3. Dann: Aus Repository installieren → Gronkh.tv Repository → Video Add-ons → Gronkh.tv
            
            Oder besuche: https://serph91p.github.io/plugin.video.gronkhtv/
